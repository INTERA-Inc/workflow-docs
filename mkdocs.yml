site_name: Project Docs
# site_url: https://github.com/INTERA-Inc/workflow-docs.git

theme:
  name: readthedocs
  navigation_depth: 3
  color_mode: dark

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - fenced_code
  - tables
  - pymdownx.highlight
  # - pymdownx.superfences
  - pymdownx.mark        # ==highlighted text==
  - pymdownx.details     # collapsible admonitions: ??? note "Title"
  - codehilite


